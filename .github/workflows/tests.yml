name: Tests & Quality

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  tests:
    name: ${{ matrix.suite }} on ${{ matrix.database }} with ${{ matrix.redis-client }}, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: test
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysql -uroot -psecret -e 'select 1' test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
        database: [sqlite, mysql, pgsql]
        redis-client: [phpredis, predis]
        suite: [Unit, Integration, Fuzz, Concurrency, Rollout]
        exclude:
          - database: sqlite
            suite: Concurrency
          - database: sqlite
            suite: Rollout
        include:
          - php: '8.3'
            database: sqlite
            redis-client: phpredis
            suite: Unit
          - php: '8.3'
            database: sqlite
            redis-client: phpredis
            suite: Integration

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
      REDIS_CLIENT: ${{ matrix.redis-client }}
      LADA_FUZZ_ITERATIONS: ${{ matrix.suite == 'Fuzz' && '3000' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: redis, apcu, pcntl, pdo_mysql, pdo_pgsql, pdo_sqlite
          ini-values: apc.enable_cli=1
          coverage: none
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install the 5.x release the Rollout suite runs beside this version
        if: matrix.suite == 'Rollout'
        run: composer install --no-interaction --prefer-dist -d tests/Rollout/legacy

      - name: Run ${{ matrix.suite }} suite
        run: vendor/bin/phpunit --no-coverage --testsuite ${{ matrix.suite }}

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: redis
          coverage: none
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Run Pint
        run: vendor/bin/pint --test
