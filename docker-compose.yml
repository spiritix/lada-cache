services:
  app:
    build: .
    image: lada-cache-app:latest
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      REDIS_HOST: redis
      REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      LADA_FUZZ_SEED: ${LADA_FUZZ_SEED:-}
      LADA_FUZZ_ITERATIONS: ${LADA_FUZZ_ITERATIONS:-}
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - main

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - main

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: test
      MYSQL_ROOT_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -psecret -e 'select 1' test"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      - main

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      - main

networks:
  main:
    driver: bridge
