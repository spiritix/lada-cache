services:
  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - main

  mysql:
    image: mysql:8.4
    ports:
      - "13306:3306"
    environment:
      MYSQL_DATABASE: test
      MYSQL_ROOT_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -psecret -e 'select 1' test"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      - main

  mariadb:
    image: mariadb:11.4
    ports:
      - "13307:3306"
    environment:
      MARIADB_DATABASE: test
      MARIADB_ROOT_PASSWORD: secret
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      - main

  postgres:
    image: postgres:17-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: test
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test"]
      interval: 2s
      timeout: 5s
      retries: 60
    networks:
      - main

networks:
  main:
    driver: bridge
